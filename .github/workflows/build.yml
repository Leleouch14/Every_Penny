name: Build Capacitor Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'every-penny-vite/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies & Build Web Assets
        working-directory: ./every-penny-vite
        run: |
          npm install
          npm run build

      - name: Sync Capacitor Android Project
        working-directory: ./every-penny-vite
        run: |
          npx cap sync android

      - name: Build Android Debug APK
        working-directory: ./every-penny-vite/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: every-penny-capacitor-apk
          path: every-penny-vite/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/' )
        uses: softprops/action-gh-release@v2
        with:
          files: every-penny-vite/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
