name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'main.py'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create a Release and upload assets
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Python and Flet
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      # Decode the permanent release keystore from the repo secret
      - name: Restore Android signing keystore
        run: echo "\({{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d >\)RUNNER_TEMP/release.jks

      - name: Build APK
        env:
          FLET_ANDROID_SIGNING_KEY_STORE: ${{ runner.temp }}/release.jks
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: yes | flet build apk --product "Every Penny" --org "com.param.everypenny"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: every-penny-apk
          path: build/apk/**/*.apk

      # Only runs when the workflow was triggered by a version tag (e.g. v1.0.0)
      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/apk/**/*.apk
